<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zu viel für gestern – Variante G: To-do</title>
<style>
  @font-face { font-family: "BigShoulders"; src: url("../fonts/BigShoulders-Bold.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: "InstrumentSerif"; src: url("../fonts/InstrumentSerif-Italic.ttf") format("truetype"); font-style: italic; }
  @font-face { font-family: "InstrumentSans"; src: url("../fonts/InstrumentSans-Regular.ttf") format("truetype"); }
  @font-face { font-family: "GeistMono"; src: url("../fonts/GeistMono-Regular.ttf") format("truetype"); }
  @font-face { font-family: "CourierPrime"; src: url("../fonts/CourierPrime-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Caveat"; src: url("../fonts/Caveat-Medium.ttf") format("truetype"); font-weight: 500; }
  @page { size: 135mm 215mm; margin: 0; }
  html, body { margin: 0; padding: 0; background: #F3F0E8; }
  svg { display: block; width: 900px; height: 1433px; }
  @media print { svg { width: 135mm; height: 215mm; } }
</style>
</head>
<body>
<svg id="cover" viewBox="0 0 900 1433" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="shared.js"></script>
<script>
// Variante G: Die ewige To-do-Liste. Alles offen, nur eins ist erledigt.
const TEXT = {
  author:  'MORITZ WOLKE',
  title:   'ZU VIEL',
  title2:  'für gestern',
  sub:     ['Warum ADHS im KI-Zeitalter', 'zur Superkraft wird'],
  tagline: 'Genau richtig für morgen.',
  caption: 'ABWEICHUNG ≠ FEHLER',
  label:   'TO-DO',
  items:   ['Steuer 2021 (!!)', 'Zahnarzt anrufen', 'Keller entrümpeln', 'Mails beantworten (alle)', 'Buch schreiben', 'Formular für das Formular'],
  done:    4,          // Index des erledigten Punkts
};
const C = { bg: '#F3F0E8', ink: '#15171B', sub: '#2A2D33', signal: '#FF4A1C', mute: '#8A857C', line: '#D6D1C7' };
const TODO = { seed: 5, hand: 40, box: 26 };

function draw() {
  el('rect', { x: 0, y: 0, width: W, height: H, fill: C.bg });
  const yA = author(TEXT, C.ink);
  const subBottom = titleBlock(TEXT, yA + 58, C);
  const footTop = footer(TEXT, C);
  const rand = rng(TODO.seed);

  const top = subBottom + 70, bottom = footTop - 50;
  const fL = [400, 12, FONTS.mono], spL = 2.6;
  const mL = ink(TEXT.label, fL, spL);
  text(TEXT.label, M + mL.left, top + mL.asc, fL, { fill: C.mute, 'letter-spacing': spL });
  const n = TEXT.items.length;
  const first = top + mL.asc + 22, pitch = (bottom - first) / n;
  const fH = [500, TODO.hand, 'Caveat'];
  const pen = { fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };

  TEXT.items.forEach((item, i) => {
    const base = first + (i + 0.7) * pitch;
    const b = TODO.box, bx = M + 2 + (rand() - 0.5) * 3, by = base - b + 3;
    // handgezeichnetes Kästchen
    el('path', { d: wobble([[bx, by], [bx + b, by + 1], [bx + b - 1, by + b], [bx + 1, by + b - 1], [bx, by - 2]], rand, 1.6),
      ...pen, stroke: C.ink, 'stroke-width': 2 });
    const mI = ink(item, fH);
    const xt = bx + b + 22, rot = (rand() - 0.5) * 2.4;
    text(item, xt + mI.left, base, fH, { fill: C.ink, transform: `rotate(${rot.toFixed(2)} ${xt} ${base})` });
    if (i === TEXT.done) {
      // orangener Haken, schwungvoll über das Kästchen hinaus
      el('path', { d: wobble([[bx + 2, by + b * 0.45], [bx + b * 0.42, by + b + 2], [bx + b + 22, by - 26]], rand, 1.2),
        ...pen, stroke: C.signal, 'stroke-width': 6 });
    }
  });
}

whenExtraFontsReady(['500 40px "Caveat"'], draw);
</script>
</body>
</html>
